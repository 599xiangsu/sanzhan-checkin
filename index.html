<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9M8.5 4.8l7 14.4M15.5 4.8l-7 14.4"/></svg></span><div><div class="brand-title">三战手记</div><div class="brand-sub">DAILY RECORDS</div></div></div>
      <div class="top-right"><button class="top-action profile-name-button" id="profileBtn" type="button" aria-label="角色管理">我的角色</button><button class="top-action" id="checkUpdateBtn" type="button">检查更新</button><button class="top-action" id="seasonStatsBtn" type="button">赛季统计</button><span class="cloud-dot" aria-hidden="true"></span><span class="local-label">仅保存在此设备</span></div>
    </header>
    <main class="layout">
      <div class="intro"><h1>祝你今日出金</h1></div>
      <div class="columns">
        <aside class="calendar-panel" aria-label="记录日历">
          <div class="cal-head"><div class="cal-month" id="monthLabel"></div><div class="cal-nav"><button class="icon-btn" id="prevMonth" aria-label="上个月"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-btn" id="nextMonth" aria-label="下个月"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div></div>
          <div class="weekdays" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days" id="calendarDays"></div>
          <div class="calendar-foot"><span class="legend"><i></i>已有记录</span><button class="today-btn" id="todayBtn">回到今天</button></div>
        </aside>
        <section class="workspace" aria-label="当日记录">
          <div class="date-strip"><div><div class="date-label">当前记录日期</div><div class="date-value" id="selectedDate"></div><div class="season-status" id="seasonStatus"></div></div><div class="date-tools"><button class="season-manage-btn" id="seasonManageBtn" type="button">赛季设置</button><div class="day-total"><strong id="dayTotal">0</strong><span>项今日记录</span></div></div></div>
          <nav class="tabs" aria-label="记录板块" id="tabs"></nav>
          <div class="board-head"><div class="board-title"><h2 id="boardTitle"></h2><span id="boardDescription"></span></div><button class="add-btn" id="addButton"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="addLabel">添加记录</span></button></div>
          <div id="records" class="records" aria-live="polite"></div>
        </section>
      </div>
    </main>
